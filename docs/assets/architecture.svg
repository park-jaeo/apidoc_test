<svg width="720" height="200" viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#5b8af5"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Client -->
  <rect x="30" y="60" width="140" height="80" rx="10" fill="#1a1a2e" stroke="#5b8af5" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="100" y="94" text-anchor="middle" fill="#a0b4f8" font-size="12" font-weight="600">Client</text>
  <text x="100" y="114" text-anchor="middle" fill="#5b7ab5" font-size="10">Browser / Mobile</text>

  <!-- Arrow 1 -->
  <line x1="170" y1="100" x2="230" y2="100" stroke="#5b8af5" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="200" y="90" text-anchor="middle" fill="#5b8af5" font-size="10">HTTPS</text>

  <!-- API Server -->
  <rect x="230" y="40" width="200" height="120" rx="10" fill="#1a1a2e" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="330" y="84" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="600">API Server</text>
  <text x="330" y="104" text-anchor="middle" fill="#7c5bbf" font-size="10">FastAPI · Auth · Router</text>
  <text x="330" y="122" text-anchor="middle" fill="#7c5bbf" font-size="10">Pydantic Validation</text>

  <!-- Arrow 2 -->
  <line x1="430" y1="100" x2="490" y2="100" stroke="#5b8af5" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="460" y="90" text-anchor="middle" fill="#5b8af5" font-size="10">Query</text>

  <!-- Database -->
  <rect x="490" y="60" width="140" height="80" rx="10" fill="#1a1a2e" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="94" text-anchor="middle" fill="#86efac" font-size="12" font-weight="600">Database</text>
  <text x="560" y="114" text-anchor="middle" fill="#4a8a5e" font-size="10">Users · Sessions</text>

  <!-- Return arrow -->
  <path d="M490 108 Q460 140 430 108" stroke="#5b8af5" stroke-width="1" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)"/>
  <text x="460" y="150" text-anchor="middle" fill="#4a6abf" font-size="10">Response</text>
  <path d="M230 108 Q200 140 170 108" stroke="#5b8af5" stroke-width="1" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)"/>

  <!-- Title -->
  <text x="360" y="188" text-anchor="middle" fill="#44444e" font-size="11">Sample API — 시스템 아키텍처</text>
</svg>
